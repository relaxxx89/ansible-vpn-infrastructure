---
- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: '22'
    proto: tcp

- name: Allow VLESS REALITY
  community.general.ufw:
    rule: allow
    port: '443'
    proto: tcp

- name: Allow Let's Encrypt HTTP-01
  community.general.ufw:
    rule: allow
    port: '80'
    proto: tcp

- name: Allow 3x-ui subscriptions
  community.general.ufw:
    rule: allow
    port: '2096'
    proto: tcp

- name: Allow VPN UDP 443
  community.general.ufw:
    rule: allow
    port: '443'
    proto: udp

- name: Deny incoming connections by default
  community.general.ufw:
    direction: incoming
    default: deny

- name: Allow outgoing connections by default
  community.general.ufw:
    direction: outgoing
    default: allow

- name: Enable firewall
  community.general.ufw:
    state: enabled
